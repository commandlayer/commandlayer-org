<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Dashboard — CommandLayer</title>
<link rel="stylesheet" href="/css/factory.css">
<style>
body{background:#f6f7fb}.operator{max-width:1100px;margin:0 auto;padding:48px 20px}.panel{background:#fff;border:1px solid #e2e6ef;border-radius:18px;padding:22px;margin-top:18px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input{flex:1;min-width:280px;border:1px solid #ccd3e0;border-radius:9px;padding:11px}.controls button{border:0;border-radius:9px;background:#111827;color:#fff;padding:11px 16px;font-weight:700}.operator-table{width:100%;border-collapse:collapse;font-size:12px}.operator-table th,.operator-table td{padding:10px 8px;border-top:1px solid #edf0f5;text-align:left}.status{color:#566176;font-size:13px}
</style>
</head>
<body><main class="operator">
<div class="kicker">CommandLayer · private operator view</div>
<h1>Receipt operations</h1>
<p class="status">Detailed event records are protected. This view is for operators, not public discovery.</p>
<div class="panel"><div class="controls"><input id="token" type="password" autocomplete="off" placeholder="Operator token"><button id="load">Load events</button></div><p id="status" class="status"></p></div>
<div class="panel" style="overflow:auto"><table class="operator-table"><thead><tr><th>Time</th><th>Service</th><th>Execution</th><th>Outcome</th><th>Settlement</th><th>Network</th><th>Transaction</th><th>Payer key hash</th></tr></thead><tbody id="events"></tbody></table></div>
</main>
<script>
document.getElementById('load').addEventListener('click',async()=>{const token=document.getElementById('token').value;const status=document.getElementById('status');const body=document.getElementById('events');status.textContent='Loading…';body.textContent='';try{const r=await fetch('/api/dashboard/operator',{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});const data=await r.json();if(!r.ok)throw new Error(data.status||'Request failed');for(const item of data.events||[]){const row=document.createElement('tr');for(const value of [item.created_at,item.service_id,item.execution_id,item.outcome,item.settlement_status,item.network,item.transaction_hash,item.payer_key_hash]){const cell=document.createElement('td');cell.textContent=value||'—';row.appendChild(cell)}body.appendChild(row)}status.textContent=(data.events||[]).length+' events loaded';}catch(error){status.textContent='Unable to load operator data.'}});
</script>
</body></html>
