name: generate-service-categories-one-shot

on:
  push:
    branches:
      - site/machine-service-factory-v4

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/machine-service-factory-v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate scalable category pages
        run: node scripts/generate-service-categories.js
      - name: Install repository dependencies
        run: npm ci
      - name: Run full repository tests
        run: npm test
      - name: Check local links
        run: npm run check:links
      - name: Remove one-shot workflow
        run: git rm .github/workflows/generate-service-categories.yml
      - name: Commit generated site
        shell: bash
        run: |
          git config user.name "commandlayer-ci"
          git config user.email "ci@commandlayer.org"
          git add public/services.html public/services public/catalog.json public/css/factory.css vercel.json tests/site-information-architecture.test.js public/data/service-categories.json scripts/generate-service-categories.js
          git commit -m "Build 12 scalable CommandLayer service families"
          git push origin HEAD:site/machine-service-factory-v4
