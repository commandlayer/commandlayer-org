name: rebuild-site-v4-one-shot

on:
  push:
    branches:
      - site/machine-service-factory-v4

permissions:
  contents: write

jobs:
  build-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/machine-service-factory-v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Expand reviewed website bundle
        run: tar -xzf .site-v4.tgz
      - name: Validate isolated IA assertions
        run: node --test tests/site-information-architecture.test.js
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full repository tests
        run: npm test
      - name: Check local links
        run: npm run check:links
      - name: Remove one-shot bundle and workflow
        run: rm -f .site-v4.tgz .github/workflows/rebuild-site-v4.yml
      - name: Commit generated website
        shell: bash
        run: |
          git config user.name "commandlayer-ci"
          git config user.email "ci@commandlayer.org"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to commit"
            exit 0
          fi
          git commit -m "Rebuild CommandLayer machine-service website"
          git push origin HEAD:site/machine-service-factory-v4
