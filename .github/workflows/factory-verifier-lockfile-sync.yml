name: factory-verifier-lockfile-sync

on:
  push:
    branches:
      - trust/factory-receipt-verifier

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trust/factory-receipt-verifier
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "commandlayer-ci"
          git config user.email "ci@commandlayer.org"
          git add package-lock.json
          git commit -m "Lock deployed VerifyAgent factory verifier"
          git push origin HEAD:trust/factory-receipt-verifier
