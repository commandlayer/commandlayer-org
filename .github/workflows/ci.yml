name: CI
on:
  push:
    branches: [main, "claude/**", "factory/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # The inherited lockfile is currently out of sync with package.json
      # (@neondatabase/serverless is missing from package-lock while an old
      # Stripe entry remains). Keep site CI usable while lockfile repair is
      # tracked separately, then return this step to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check:links
