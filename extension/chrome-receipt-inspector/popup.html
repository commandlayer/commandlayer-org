<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VerifyAgent</title>
  <link rel="stylesheet" href="content.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="shield">✓</div>
      <div>
        <h1>VerifyAgent</h1>
        <p>Evidence first, not endorsement.</p>
      </div>
    </header>

    <section class="context" id="context" hidden>
      <span id="contextText"></span>
      <button id="useContext" type="button">Use detected evidence</button>
    </section>

    <label for="evidence">Receipt or evidence</label>
    <textarea id="evidence" spellcheck="false" placeholder="Paste receipt JSON, clrcpt_… ID, name.eth, or 0x transaction hash"></textarea>

    <div class="actions">
      <button class="primary" id="verify" type="button">Verify evidence</button>
      <button class="secondary" id="useSelection" type="button">Use page selection</button>
    </div>

    <section id="result" class="result empty">
      <div class="status-dot"></div>
      <div>
        <strong>Ready</strong>
        <p>Paste evidence or select something on the current page.</p>
      </div>
    </section>

    <div id="details"></div>
    <footer>Cryptographic validity is not a safety endorsement.</footer>
  </main>
  <script src="adapters.js"></script>
  <script src="popup.js"></script>
</body>
</html>
